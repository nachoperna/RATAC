services:
  db:
    image: postgres:17-alpine
    container_name: RATAC_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: RATAC_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB/schema:/docker-entrypoint-initdb.d:ro,Z # ro,Z agregado por problemas especificos de Fedora
  
  db_test:
      image: postgres:17-alpine
      container_name: RATAC_db_test
      restart: always
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: password
        POSTGRES_DB: RATAC_DB_TEST
      ports:
        - "5433:5432"
      volumes:
        - postgres_data_test:/var/lib/postgresql/data
        - ./DB/schema:/docker-entrypoint-initdb.d:ro,Z # ro,Z agregado por problemas especificos de Fedora
  
  app:
    build: 
      context: .
      target: builder # Durante desarrollo usamos la etapa pesada para poder recompilar
    container_name: RATAC_app
    ports:
      - "80:8080"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://admin:password@db:5432/RATAC_DB?sslmode=disable
    env_file:
      - .env
    volumes:
      - .:/app # Esto sincroniza tus archivos locales con el contenedor
    command: >
      sh -c "templ generate && 
             sqlc generate && 
             go run ." 
  app-prod:
    build:
      context: .
      target: production
    container_name: RATAC_app_prod
    ports:
      - "80:8080"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://admin:password@db:5432/RATAC_DB?sslmode=disable
    env_file:
      - .env
    restart: unless-stopped
    profiles: ["production"]
    volumes:
      - ./IMAGENES:/app/IMAGENES
      - ./JSONS:/app/JSONS
      - ./Histopatología:/app/Histopatología
      - ./ArchivosTemporales:/app/ArchivosTemporales

  beyla:
    image: grafana/beyla:3.43.0
    profiles: ["observability"]
    pid: "service:app-prod"
    privileged: true
    environment:
      - BEYLA_OPEN_PORT=8080
      - BEYLA_SERVICE_NAME=ratac-app
      - BEYLA_PROMETHEUS_PORT=9090
      - BEYLA_ROUTES_UNMATCH=wildcard
      - BEYLA_ROUTES_PATTERNS=/paciente/protocolo/{protocolo}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - BEYLA_ROUTES_IGNORE=/grafana/*
    ports:
      - "9090:9090"
    depends_on:
      - app-prod

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      - beyla

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  tempo:
    image: grafana/tempo:2.7.2
    user: "0"
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["observability"]
    pid: "host"
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
    ports:
      - "9100:9100"

volumes:
  postgres_data:
  postgres_data_test:
  grafana_data:
  tempo_data:
