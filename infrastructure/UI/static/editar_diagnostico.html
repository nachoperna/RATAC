<!DOCTYPE html>
<html lang="es">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>RATAC — Carga de Documentos</title>
      <link rel="icon" type="image/svg" href="/static/img/RATAC ISOLOGO FULL COLOR.svg">
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="/static/index.css?v=1">
      <link rel="stylesheet" href="/static/carga_diagnostico.css?v=1">
      <script src="https://unpkg.com/htmx.org@1.9.10"></script>
      <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>   
      <script defer src="/static/confirmacion.js?v=1"></script>
      <script defer src="/static/carga_diagnostico.js?v=1"></script>
</head>
<body>

      <header>
            <a class="logo" href="/">
                  <img src="/static/img/RATAC LOGO FULL COLOR HORIZONTAL.svg" alt="RATAC" style="height:38px; width:auto; display:block;">
            </a>
            <nav>
                  <a class="nav-badge" href="/diagnosticos/alta">Cargar Diagnostico</a>
                  <a class="nav-badge" href="/admin/panel">Mi Panel</a>
                  <a class="nav-logout" hx-get="/logout" hx-confirm="Desea cerrar sesión en este momento?">
                        <div class="logout-icon">
                              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                              </svg>
                        </div>
                        <span class="logout-text">Cerrar Sesión</span>
                  </a>
            </nav>
      </header>

      <main class="container">
            <!-- Título centrado -->
            <div class="page-header">
                  <h1>Edición de Diagnóstico</h1>
                  <p>Edita todos los campos que necesites y luego confírmalos o cancélalos.</p>
            </div>

            <!-- Grid de dos columnas -->
            <div class="content-grid" style="grid-template-columns:1fr; max-width:900px; margin-left:auto; margin-right:auto;">

                  <!-- Columna Derecha: Formulario -->
                  <div class="right-column">
                        <section class="form-section" id="form-section">
                              <div class="form-section-title">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                    Revisión de Datos
                              </div>

                              <!-- Datos Generales -->
                              <div class="form-grid">
                                    <div class="form-group">
                                          <label class="form-label">Protocolo</label>
                                          <input type="text" class="form-control" id="f-protocolo" value={{.Protocolo}} readonly>
                                    </div>
                                    <div class="form-group">
                                          <label class="form-label">Fecha</label>
                                          <input type="text" class="form-control" id="f-fecha" value={{.Fecha}}>
                                    </div>
 
                                    <div class="form-group">
                                          <label class="form-label">Solicitante</label>
                                          <input type="text" class="form-control" id="f-solicitante" value={{.Solicitante}}>
                                    </div>
 
                                    <div class="form-group">
                                          <label class="form-label">Técnica</label>
                                          <input type="text" class="form-control" id="f-tecnica" value={{.Tecnica}}>
                                    </div>

                                    <div class="form-group">
                                          <label class="form-label">Familia</label>
                                          <input type="text" class="form-control" id="f-familia" value={{.Familia}}>
                                    </div>

                                    <div class="form-group">
                                          <label class="form-label">Especie</label>
                                          <input type="text" class="form-control" id="f-especie" value={{.Especie}}>
                                    </div>
                                    <div class="form-group">
                                          <label class="form-label">Raza</label>
                                          <input type="text" class="form-control" id="f-raza" value={{.Raza}}>
                                    </div>

                                    <div class="form-group">
                                          <label class="form-label">Edad (Meses/Años)</label>
                                          <input type="text" class="form-control" id="f-edad" value={{.Edad}}>
                                    </div>
 
                                    <div class="form-group">
                                          <label class="form-label">Paciente</label>
                                          <input type="text" class="form-control" id="f-paciente" value={{.NombrePaciente}}>
                                    </div>

                                    <div class="form-group" style="display: flex; align-items: center; padding-top: 24px;">
                                          <label class="checkbox-label">
                                                <input type="checkbox" id="f-mastocitomas" checked?={{.ReferenciasMastocitomas}}>
                                                Referencias a mastocitomas
                                          </label>
                                    </div>

                                    <!-- Textos Largos -->
                                    <div class="form-group full-width">
                                          <label class="form-label">Material remitido - Antecedentes</label>
                                          <textarea class="form-control" id="f-antecedentes">{{.Antecedentes}}</textarea>
                                    </div>
                                    <div class="form-group full-width">
                                          <label class="form-label">Descripción macroscópica</label>
                                          <textarea class="form-control" id="f-macroscopica">{{.DescripcionMacroscopica}}</textarea>
                                    </div>
                              </div>

                              <!-- Contenedor dinámico para descripciones microscópicas -->
                              <div class="micro-section-container">
                                    <div class="form-section-title">Análisis Microscópico y Diagnósticos</div>
                                    {{render .DescMicro}}
                                    <button class="btn btn-outline" style="margin-top: 16px;" onclick="addEmptyMicroCard()">+ Añadir Hallazgo</button>
                              </div>

                              <!-- Acciones -->
                              <div class="actions-bar">
                                    <button 
                                          class="btn btn-outline" 
                                          onclick="limpiarEdicion()"
                                          >Limpiar Edición
                                    </button>
                                    <button 
                                          class="btn btn-primary" 
                                          id="btn-submit" 
                                          hx-post=""
                                          hx-encoding="multipart/form-data"
                                          hx-on:htmx:before-request="validacionYFormData(event, true)"
                                          >Confirmar Edición
                                    </button>
                              </div>
                        </section>
                  </div>
            </div>
      </main>
      <label id="scroll-up" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" ><path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"/></svg>
      </label>
      <!-- Overlay de Error HTML -->
      <div id="error" class="error-overlay"> </div>

      <script>
            document.addEventListener('DOMContentLoaded', function () {
                  if (typeof guardarEstado === 'function') guardarEstado();
            }); 
      </script>
</body>
</html>
